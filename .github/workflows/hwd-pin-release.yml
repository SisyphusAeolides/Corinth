name: HWD dependency alignment validation

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'hwd-catalog-pin'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hwd-catalog-pin
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - run: cargo update -p arach-hwd --precise 569c40a530fb8e5fe9fc618b97c7ae4a5795f634
      - run: cargo fmt --all
      - run: cargo check --locked --features host-store --all-targets
      - run: cargo test --locked --features fortran-policy,host-store
      - run: >-
          cargo clippy --locked --features host-store --all-targets --
          -D warnings
          -A clippy::new_without_default
          -A clippy::manual_memcpy
          -A clippy::needless_range_loop
          -A clippy::unnecessary_map_or
          -A clippy::unused_enumerate_index
      - run: cargo check --locked --features os-bin --bin corinth
      - run: git diff --check
      - name: Publish verified dependency lock
        run: |
          git rm .github/workflows/hwd-pin-release.yml
          git config user.name "SisyphusAeolides"
          git config user.email "SisyphusAeolides@users.noreply.github.com"
          git add -A
          git commit -m "Verify HWD dependency alignment"
          git push origin HEAD:hwd-catalog-pin
