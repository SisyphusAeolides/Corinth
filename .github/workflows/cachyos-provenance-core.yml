name: CachyOS provenance core

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cachyos-provenance-core.yml

permissions:
  contents: write

concurrency:
  group: cachyos-provenance-core
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Add CachyOS provenance core
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count}, found {actual}: {old!r}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace('src/indexer.rs', 'pub const UPSTREAM_COUNT: usize = 10;', 'pub const UPSTREAM_COUNT: usize = 11;')
          replace('src/indexer.rs', '    Aur,\n    Fedora,', '    Aur,\n    Cachyos,\n    Fedora,')
          replace('src/indexer.rs', '    Upstream::Aur,\n    Upstream::Fedora,', '    Upstream::Aur,\n    Upstream::Cachyos,\n    Upstream::Fedora,')

          replace('src/universal_import.rs', '    Aur,\n    Fedora,', '    Aur,\n    Cachyos,\n    Fedora,')
          replace('src/universal_import.rs', '            Self::Aur => "aur",\n            Self::Fedora', '            Self::Aur => "aur",\n            Self::Cachyos => "cachyos",\n            Self::Fedora')
          replace(
              'src/universal_import.rs',
              '            UniversalEcosystem::Arch\n            | UniversalEcosystem::Aur\n            | UniversalEcosystem::Fedora',
              '            UniversalEcosystem::Arch\n            | UniversalEcosystem::Aur\n            | UniversalEcosystem::Cachyos\n            | UniversalEcosystem::Fedora',
          )
          replace(
              'src/universal_import.rs',
              '            UniversalEcosystem::Arch | UniversalEcosystem::Aur,',
              '            UniversalEcosystem::Arch\n            | UniversalEcosystem::Aur\n            | UniversalEcosystem::Cachyos,',
          )

          replace(
              'src/universal_discovery.rs',
              '''    if request.ecosystem == UniversalEcosystem::Arch
        && request.repository
            != format!(
                "https://gitlab.archlinux.org/archlinux/packaging/packages/{}.git",
                request.package
            )
    {
        return Err(DiscoveryError::InvalidRequest(
            "Arch repository identity must be derived from the package".into(),
        ));
    }
    Ok(())
}''',
              '''    if request.ecosystem == UniversalEcosystem::Arch
        && request.repository
            != format!(
                "https://gitlab.archlinux.org/archlinux/packaging/packages/{}.git",
                request.package
            )
    {
        return Err(DiscoveryError::InvalidRequest(
            "Arch repository identity must be derived from the package".into(),
        ));
    }
    if request.ecosystem == UniversalEcosystem::Cachyos
        && (request.repository != "https://github.com/CachyOS/CachyOS-PKGBUILDS.git"
            || !(request.metadata_path == "PKGBUILD"
                || request.metadata_path.ends_with("/PKGBUILD")))
    {
        return Err(DiscoveryError::InvalidRequest(
            "CachyOS discovery must use the canonical monorepo and a PKGBUILD path".into(),
        ));
    }
    Ok(())
}''',
          )

          replace(
              'src/bin/corinth-discover.rs',
              '        UniversalEcosystem::Nix => {',
              '        UniversalEcosystem::Cachyos | UniversalEcosystem::Nix => {',
          )
          replace('src/bin/corinth-discover.rs', '        "aur" => Ok(UniversalEcosystem::Aur),\n        "fedora"', '        "aur" => Ok(UniversalEcosystem::Aur),\n        "cachyos" => Ok(UniversalEcosystem::Cachyos),\n        "fedora"')
          replace(
              'src/bin/corinth-discover.rs',
              '<arch|aur|fedora|debian|alpine|gentoo|crux|nix|cargo>',
              '<arch|aur|cachyos|fedora|debian|alpine|gentoo|crux|nix|cargo>',
          )

          replace('src/corpus.rs', '        Upstream::Aur => "aur",\n        Upstream::Fedora', '        Upstream::Aur => "aur",\n        Upstream::Cachyos => "cachyos",\n        Upstream::Fedora')
          replace(
              'src/bin/corinth-corpus.rs',
              '            | (Upstream::Aur, UniversalEcosystem::Aur)\n            | (Upstream::Fedora',
              '            | (Upstream::Aur, UniversalEcosystem::Aur)\n            | (Upstream::Cachyos, UniversalEcosystem::Cachyos)\n            | (Upstream::Fedora',
          )
          replace('src/bin/corinth-corpus.rs', '        Upstream::Aur => "aur",\n        Upstream::Fedora', '        Upstream::Aur => "aur",\n        Upstream::Cachyos => "cachyos",\n        Upstream::Fedora')

          Path('.github/workflows/cachyos-provenance-core.yml').unlink()
          PY
      - name: Validate Rust graph
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --features host-store -- -D warnings
          cargo test --locked --all-targets --features host-store
          cargo check --locked --no-default-features
          git diff --check
      - name: Commit provenance core
        run: |
          git config user.name 'SisyphusAeolides'
          git config user.email '37166405+SisyphusAeolides@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add CachyOS provenance core'
          git pull --rebase origin main
          git push origin HEAD:main
