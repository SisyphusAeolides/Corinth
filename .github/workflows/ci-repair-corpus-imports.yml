name: Repair corpus imports

on:
  push:
    branches: [main]
    paths:
      - scripts/repair_corpus_imports.py
      - .github/workflows/ci-repair-corpus-imports.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply corpus import repair
        run: |
          python3 scripts/repair_corpus_imports.py
          cargo fmt --all
          rm scripts/repair_corpus_imports.py
          git diff --check
      - name: Validate corpus imports
        run: cargo clippy --locked --all-targets --features fortran-policy,host-store -- -D warnings -A clippy::new_without_default -A clippy::manual_memcpy -A clippy::needless_range_loop -A clippy::unused_enumerate_index
      - name: Commit repaired imports
        run: |
          git config user.name 'SisyphusAeolides'
          git config user.email '37166405+SisyphusAeolides@users.noreply.github.com'
          git add src/corpus.rs scripts/repair_corpus_imports.py
          git commit -m 'fix: repair corpus no-std imports'
          git pull --rebase origin main
          git push origin HEAD:main
