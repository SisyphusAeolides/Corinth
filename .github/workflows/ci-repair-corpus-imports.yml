name: Repair corpus imports

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci-repair-corpus-imports.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Repair no-std corpus imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/corpus.rs")
          text = path.read_text(encoding="utf-8")
          old = "use alloc::{collections::BTreeSet, format, string::String, vec::Vec};\n"
          new = "use alloc::{\n    collections::BTreeSet,\n    string::{String, ToString},\n    vec::Vec,\n};\n#[cfg(test)]\nuse alloc::format;\n"
          if text.count(old) != 1:
              raise SystemExit("corpus import line differs")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          cargo fmt --all
      - name: Validate repaired corpus imports
        run: >-
          cargo clippy --locked --all-targets --features fortran-policy,host-store --
          -D warnings
          -A clippy::new_without_default
          -A clippy::manual_memcpy
          -A clippy::needless_range_loop
          -A clippy::unused_enumerate_index
      - name: Commit repair
        run: |
          git config user.name 'SisyphusAeolides'
          git config user.email '37166405+SisyphusAeolides@users.noreply.github.com'
          git add src/corpus.rs
          git commit -m 'fix: repair corpus no-std imports'
          git pull --rebase origin main
          git push origin HEAD:main
