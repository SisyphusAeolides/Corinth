name: Package semantics

on:
  push:
    paths:
      - src/semantics.rs
      - src/lib.rs
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/package-semantics.yml
  pull_request:
    paths:
      - src/semantics.rs
      - src/lib.rs
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/package-semantics.yml

permissions:
  contents: read

jobs:
  semantics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Test package semantics
        run: cargo test --locked --lib semantics::tests
      - name: Check serialized host-store semantics
        run: cargo check --locked --lib --features host-store
      - name: Lint semantics contract
        run: cargo clippy --locked --lib --all-features -- -D warnings
      - name: Check formatting
        run: cargo fmt --all -- --check
