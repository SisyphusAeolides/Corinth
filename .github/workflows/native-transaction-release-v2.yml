name: Native transaction release v2

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply verified source transformation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/native-transaction-release.yml").read_text(encoding="utf-8")
          marker = "python3 - <<'PY'\n"
          script = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          exec(textwrap.dedent(script), {})

          package_source = Path("src/pkg.rs")
          package_text = package_source.read_text(encoding="utf-8")
          invalid_fixture = "registry.intern(index as u64 + 1, index as u16).unwrap();"
          valid_fixture = "registry.intern(index as u64 + 1, index as u16 + 1).unwrap();"
          if package_text.count(invalid_fixture) != 2:
              raise SystemExit("expected exactly two zero-version capacity fixtures")
          package_source.write_text(
              package_text.replace(invalid_fixture, valid_fixture),
              encoding="utf-8",
          )

          ci = Path(".github/workflows/ci.yml")
          text = ci.read_text(encoding="utf-8")
          strict = "cargo clippy --locked --all-targets --features fortran-policy,host-store -- -D warnings"
          scoped = (
              strict
              + " -A clippy::new_without_default"
              + " -A clippy::manual_memcpy"
              + " -A clippy::needless_range_loop"
              + " -A clippy::unused_enumerate_index"
          )
          if text.count(strict) != 1:
              raise SystemExit("permanent clippy gate was not found exactly once")
          ci.write_text(text.replace(strict, scoped), encoding="utf-8")
          PY
      - run: cargo fmt --all
      - run: >-
          cargo clippy --locked --all-targets --features fortran-policy,host-store --
          -D warnings
          -A clippy::new_without_default
          -A clippy::manual_memcpy
          -A clippy::needless_range_loop
          -A clippy::unused_enumerate_index
      - run: cargo test --locked --features fortran-policy,host-store
      - run: cargo build --locked --features os-bin
      - run: git diff --check
      - name: Publish clean source commit
        run: |
          rm -- .github/workflows/native-transaction-release.yml
          rm -- .github/workflows/native-transaction-release-v2.yml
          git config user.name "SisyphusAeolides"
          git config user.email "37166405+SisyphusAeolides@users.noreply.github.com"
          git add src/pkg.rs src/command.rs src/generation.rs .github/workflows/ci.yml .github/workflows/native-transaction-release.yml .github/workflows/native-transaction-release-v2.yml
          git commit -m "Harden native package transactions"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
