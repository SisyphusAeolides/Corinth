name: Release source format

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  format-and-verify:
    if: github.head_ref == 'release-format'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release-format
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - run: cargo fmt --all
      - run: cargo check --locked --features host-store --all-targets
      - run: cargo test --locked --features host-store
      - run: >-
          cargo clippy --locked --features host-store --all-targets --
          -D warnings
          -A clippy::new_without_default
          -A clippy::manual_memcpy
          -A clippy::needless_range_loop
          -A clippy::unnecessary_map_or
          -A clippy::unused_enumerate_index
      - run: git diff --check
      - name: Publish verified formatting
        run: |
          git rm .github/workflows/release-format.yml .release-format-trigger .release-format-ready .release-format-start .release-format-pr
          git config user.name "SisyphusAeolides"
          git config user.email "SisyphusAeolides@users.noreply.github.com"
          git add -A
          git commit -m "Format release sources"
          git push origin HEAD:release-format
