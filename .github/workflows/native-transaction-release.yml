name: Native transaction release

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply transaction integrity changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match in {path}, found {text.count(old)}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "src/pkg.rs",
              """    InvalidResolverState,\n    InvalidPackageIdentity,\n""",
              """    InvalidResolverState,\n    InvalidPersistentState,\n    InvalidPackageIdentity,\n""",
          )
          replace_once(
              "src/pkg.rs",
              """    pub fn authority(&self) -> TransactionAuthority {\n""",
              """    /// Reconstruct a verified durable generation without manufacturing\n    /// rollback history. The generation codec authenticates the state digest;\n    /// this boundary enforces the ledger's capacity and identity invariants.\n    pub fn restore(\n        generation: u64,\n        packages: &[ResolvedPackage],\n    ) -> Result<Self, PackageError> {\n        if packages.len() > MAX_INSTALLED_PACKAGES\n            || (generation == 0 && !packages.is_empty())\n            || !canonical(packages)\n        {\n            return Err(PackageError::InvalidPersistentState);\n        }\n        let mut ledger = Self::new();\n        ledger.packages[..packages.len()].copy_from_slice(packages);\n        ledger.count = packages.len() as u16;\n        ledger.generation = generation;\n        Ok(ledger)\n    }\n\n    pub fn authority(&self) -> TransactionAuthority {\n""",
          )
          replace_once(
              "src/pkg.rs",
              """        if self.packages[index].version_idx != expected_version {\n            return Err(PackageError::VersionPreconditionFailed);\n        }\n        self.packages[index].version_idx = replacement_version;\n""",
              """        if self.packages[index].version_idx != expected_version\n            || replacement_version == 0\n        {\n            return Err(PackageError::VersionPreconditionFailed);\n        }\n        self.packages[index].version_idx = replacement_version;\n""",
          )
          replace_once(
              "src/pkg.rs",
              """        if package.name_hash == 0 {\n            return Err(PackageError::InvalidPackageIdentity);\n        }\n        let count = usize::from(self.count);\n""",
              """        if package.name_hash == 0 || package.version_idx == 0 {\n            return Err(PackageError::InvalidPackageIdentity);\n        }\n        let count = usize::from(self.count);\n""",
          )
          replace_once(
              "src/pkg.rs",
              """fn canonical(packages: &[ResolvedPackage]) -> bool {\n    packages\n        .windows(2)\n        .all(|pair| pair[0].name_hash != 0 && pair[0].name_hash < pair[1].name_hash)\n        && packages\n            .last()\n            .map_or(true, |package| package.name_hash != 0)\n}\n""",
              """fn canonical(packages: &[ResolvedPackage]) -> bool {\n    packages.iter().all(|package| {\n        package.name_hash != 0 && package.version_idx != 0\n    }) && packages\n        .windows(2)\n        .all(|pair| pair[0].name_hash < pair[1].name_hash)\n}\n""",
          )
          replace_once(
              "src/pkg.rs",
              """    #[test]\n    fn zero_name_hash_cannot_enter_a_transaction() {\n""",
              """    #[test]\n    fn verified_generation_restore_preserves_authority() {\n        let packages = [package(\"core\", 2), package(\"network\", 4)];\n        let ledger = PackageLedger::restore(9, &packages).unwrap();\n        assert_eq!(ledger.installed(), packages);\n        assert_eq!(ledger.authority().generation(), 9);\n        assert_eq!(\n            ledger.authority().state_digest(),\n            installed_state_digest(&packages)\n        );\n        assert_eq!(\n            PackageLedger::restore(0, &packages),\n            Err(PackageError::InvalidPersistentState)\n        );\n    }\n\n    #[test]\n    fn zero_versions_cannot_enter_or_restore() {\n        let ledger = PackageLedger::new();\n        let mut transaction = ledger.begin(ledger.authority()).unwrap();\n        assert_eq!(\n            transaction.install(package(\"core\", 0)),\n            Err(PackageError::InvalidPackageIdentity)\n        );\n        assert_eq!(\n            PackageLedger::restore(1, &[package(\"core\", 0)]),\n            Err(PackageError::InvalidPersistentState)\n        );\n    }\n\n    #[test]\n    fn zero_name_hash_cannot_enter_a_transaction() {\n""",
          )

          replace_once(
              "src/command.rs",
              """        PackageVerb::Update => {\n            if builtin_package(command.package).is_none() {\n                return Err(CommandError::PackageUnavailable);\n            }\n            let version = ledger\n                .version_of(command.package_hash)\n                .ok_or(CommandError::Package(PackageError::PackageNotInstalled))?;\n            let replacement = version.checked_add(1).ok_or(CommandError::Package(\n                PackageError::VersionPreconditionFailed,\n            ))?;\n            let authority = ledger.authority();\n            let mut transaction = ledger.begin(authority).map_err(CommandError::Package)?;\n            transaction\n                .upgrade(command.package_hash, version, replacement)\n                .map_err(CommandError::Package)?;\n""",
              """        PackageVerb::Update => {\n            let Some(package) = builtin_package(command.package) else {\n                return Err(CommandError::PackageUnavailable);\n            };\n            let version = ledger\n                .version_of(command.package_hash)\n                .ok_or(CommandError::Package(PackageError::PackageNotInstalled))?;\n            if package.version_index <= version {\n                return Err(CommandError::Package(\n                    PackageError::VersionPreconditionFailed,\n                ));\n            }\n            let authority = ledger.authority();\n            let mut transaction = ledger.begin(authority).map_err(CommandError::Package)?;\n            transaction\n                .upgrade(command.package_hash, version, package.version_index)\n                .map_err(CommandError::Package)?;\n""",
          )
          replace_once(
              "src/command.rs",
              """    fn stages_atomic_install_remove_and_update_without_claiming_persistence() {\n""",
              """    fn stages_install_and_remove_without_fabricating_an_update() {\n""",
          )
          replace_once(
              "src/command.rs",
              """        let update = parse(&[b\"corinth\", b\"update\", b\"crest\"]).unwrap();\n        let CommandResult::Staged(receipt) = execute(update, &mut ledger).unwrap() else {\n            panic!(\"update must stage a transaction\")\n        };\n        assert_eq!(\n            (receipt.installed, receipt.removed, receipt.upgraded),\n            (0, 0, 1)\n        );\n\n""",
              """        let update = parse(&[b\"corinth\", b\"update\", b\"crest\"]).unwrap();\n        assert_eq!(\n            execute(update, &mut ledger),\n            Err(CommandError::Package(\n                PackageError::VersionPreconditionFailed\n            ))\n        );\n\n""",
          )

          replace_once(
              "src/generation.rs",
              """use crate::pkg::{MAX_INSTALLED_PACKAGES, PackageLedger, ResolvedPackage, installed_state_digest};\n""",
              """use crate::pkg::{\n    MAX_INSTALLED_PACKAGES, PackageError, PackageLedger, ResolvedPackage,\n    installed_state_digest,\n};\n""",
          )
          replace_once(
              "src/generation.rs",
              """    pub fn encoded_len(&self) -> usize {\n""",
              """    pub fn restore_ledger(&self) -> Result<PackageLedger, PackageError> {\n        PackageLedger::restore(self.generation, self.packages())\n    }\n\n    pub fn encoded_len(&self) -> usize {\n""",
          )
          replace_once(
              "src/generation.rs",
              """        assert_eq!(GenerationImage::decode(&bytes[..length]), Ok(image));\n""",
              """        let decoded = GenerationImage::decode(&bytes[..length]).unwrap();\n        assert_eq!(decoded, image);\n        let restored = decoded.restore_ledger().unwrap();\n        assert_eq!(restored.authority().generation(), image.generation());\n        assert_eq!(restored.installed(), image.packages());\n""",
          )

          replace_once(
              ".github/workflows/ci.yml",
              """          components: rustfmt\n      - run: cargo fmt --all -- --check\n      - run: cargo test --locked --features fortran-policy,host-store\n      - run: git diff --check\n""",
              """          components: rustfmt,clippy\n      - run: cargo fmt --all -- --check\n      - run: cargo clippy --locked --all-targets --features fortran-policy,host-store -- -D warnings\n      - run: cargo test --locked --features fortran-policy,host-store\n      - run: cargo build --locked --features os-bin\n      - run: git diff --check\n""",
          )
          PY
      - run: cargo fmt --all
      - run: cargo clippy --locked --all-targets --features fortran-policy,host-store -- -D warnings
      - run: cargo test --locked --features fortran-policy,host-store
      - run: cargo build --locked --features os-bin
      - run: git diff --check
      - name: Publish clean source commit
        run: |
          rm -- .github/workflows/native-transaction-release.yml
          git config user.name "SisyphusAeolides"
          git config user.email "37166405+SisyphusAeolides@users.noreply.github.com"
          git add src/pkg.rs src/command.rs src/generation.rs .github/workflows/ci.yml .github/workflows/native-transaction-release.yml
          git commit -m "Harden native package transactions"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
