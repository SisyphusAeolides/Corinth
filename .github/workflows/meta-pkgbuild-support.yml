          tests = '''
    #[test]
    fn source_less_dependency_bundle_parses_as_meta_candidate() {
        let parsed = parse_pkgbuild(META_PKGBUILD.as_bytes()).unwrap();
        assert!(parsed.sources.is_empty());
        assert_eq!(parsed.depends, vec!["gamescope", "mangohud"]);
    }

    #[test]
    fn meta_target_policy_is_typed_and_command_free() {
        let text = target_policy_text("cachyos-gaming-meta")
            .replace("build_system = \\"cmake\\"", "build_system = \\"meta\\"")
            .replace(
                "build_commands = [\\"cmake -S . -B build\\", \\"cmake --build build\\"]",
                "build_commands = []",
            )
            .replace("outputs = [\\"build/demo\\"]", "outputs = []");
        let policy = parse_target_policy(text.as_bytes()).unwrap();
        assert_eq!(policy.build_system, "meta");
        assert!(policy.build_commands.is_empty());
        assert!(policy.outputs.is_empty());
    }

    #[test]
    fn meta_recipe_is_canonical_and_source_less() {
        let metadata = parse_pkgbuild(META_PKGBUILD.as_bytes()).unwrap();
        let imported = build_recipe(&metadata, &meta_target()).unwrap();
        let recipe = crate::hardware::parse_recipe(&imported.bytes).unwrap();
        assert_eq!(recipe.package.name, "cachyos-gaming-meta");
        assert_eq!(recipe.build.system, "meta");
        assert!(recipe.source.is_empty());
        assert!(recipe.build.commands.is_empty());
        assert!(recipe.build.outputs.is_empty());
    }

    #[test]
    fn source_less_package_requires_meta_target() {
        let metadata = parse_pkgbuild(META_PKGBUILD.as_bytes()).unwrap();
        assert!(matches!(
            build_recipe(&metadata, &target()),
            Err(ArchImportError::TargetInvalid(_))
        ));
    }
