name: Corinth validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-fortran:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap cargo gfortran rustc
      - run: |
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - run: cargo +stable fmt --all -- --check
      - run: >-
          cargo +stable clippy --locked --all-targets --features fortran-policy,host-store --
          -D warnings
          -A clippy::new_without_default
          -A clippy::manual_memcpy
          -A clippy::needless_range_loop
          -A clippy::unused_enumerate_index
      - run: cargo +stable test --locked --features fortran-policy,host-store
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20
          components: rust-src
      - run: >-
          cargo +nightly-2026-07-20 build --locked --release --features os-bin
          --target targets/x86_64-arach.json
          -Z json-target-spec
          -Z build-std=core,alloc,compiler_builtins
          -Z build-std-features=compiler-builtins-mem
      - run: test -s target/x86_64-arach/release/corinth
      - run: git diff --check

  idris-agda:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y build-essential chezscheme libgmp-dev xz-utils curl
      - uses: actions/cache@v6
        with:
          path: target/formal/toolchains
          key: corinth-formal-idris2-0.8.0-agda-2.8.0-v1
      - run: scripts/bootstrap-formal-toolchains.sh
      - run: scripts/check-formal-models.sh
