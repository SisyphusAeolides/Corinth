name: Corinth validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  publish-kernel-adapter:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Materialize adapter candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          patch = Path("scripts/patch-kernel-package-adapter.py")
          text = patch.read_text(encoding="utf-8")
          marker = '    """        output.extend_from_slice(if source.submodules {'
          if text.count(marker) != 2:
              raise SystemExit("expected two source-lock patch literals")
          patch.write_text(
              text.replace(marker, '    r"""        output.extend_from_slice(if source.submodules {'),
              encoding="utf-8",
          )
          PY
          python3 scripts/patch-kernel-package-adapter.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/hardware.rs")
          text = path.read_text(encoding="utf-8")
          old = """            version: None,
            submodules,
        })
"""
          new = """            version: None,
            destination: None,
            submodules,
        })
"""
          if text.count(old) != 1:
              raise SystemExit(f"expected one repository source initializer, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - run: cargo fmt --all
      - run: >-
          cargo clippy --locked --all-targets --features fortran-policy,host-store --
          -D warnings
          -A clippy::new_without_default
          -A clippy::manual_memcpy
          -A clippy::needless_range_loop
          -A clippy::unused_enumerate_index
      - run: cargo test --locked --features fortran-policy,host-store
      - run: git diff --check
      - name: Publish validated source
        run: |
          git config user.name "SisyphusAeolides"
          git config user.email "37166405+SisyphusAeolides@users.noreply.github.com"
          git add src/hardware.rs src/arch_import.rs
          git commit -m "Add fixed Arach kernel package adapter"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
