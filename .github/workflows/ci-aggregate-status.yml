name: CI aggregate status

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: ci-aggregate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Publish latest observed main workflow conclusions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          sha="$GITHUB_SHA"
          self_path=".github/workflows/ci-aggregate-status.yml"
          actions_url="https://github.com/$repo/actions"
          observed=0
          unobserved=0
          failed=0
          printf '## CI aggregate status\n\n| Workflow | Conclusion | Revision |\n|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r workflow_id workflow_name workflow_path; do
            [ -n "$workflow_id" ] || continue
            [ "$workflow_path" != "$self_path" ] || continue
            run_json="$(gh api "repos/$repo/actions/workflows/$workflow_id/runs?branch=main&per_page=1" --jq '.workflow_runs[0] // empty')"
            if [ -z "$run_json" ]; then
              unobserved=$((unobserved + 1))
              printf '| %s | not scheduled on main | - |\n' "$workflow_name" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            observed=$((observed + 1))
            run_id="$(jq -r '.id' <<< "$run_json")"
            status="$(jq -r '.status' <<< "$run_json")"
            deadline=$((SECONDS + 1800))
            while [ "$status" != "completed" ] && [ "$SECONDS" -lt "$deadline" ]; do
              sleep 20
              run_json="$(gh api "repos/$repo/actions/runs/$run_id")"
              status="$(jq -r '.status' <<< "$run_json")"
            done
            run_sha="$(jq -r '.head_sha // "unknown"' <<< "$run_json")"
            run_url="$(jq -r '.html_url // empty' <<< "$run_json")"
            [ -n "$run_url" ] || run_url="$actions_url"
            if [ "$status" != "completed" ]; then
              state="error"; conclusion="timed_out"; failed=$((failed + 1))
            else
              conclusion="$(jq -r '.conclusion // "unknown"' <<< "$run_json")"
              case "$conclusion" in
                success|neutral|skipped) state="success" ;;
                failure) state="failure"; failed=$((failed + 1)) ;;
                *) state="error"; failed=$((failed + 1)) ;;
              esac
            fi
            context="$(printf 'ci/%s-%s' "$workflow_name" "$workflow_id" | cut -c1-100)"
            short_sha="${run_sha:0:7}"
            gh api --method POST "repos/$repo/statuses/$sha" -f state="$state" -f context="$context" -f description="latest $conclusion at $short_sha" -f target_url="$run_url" >/dev/null
            printf '| %s | %s | `%s` |\n' "$workflow_name" "$conclusion" "$short_sha" >> "$GITHUB_STEP_SUMMARY"
          done < <(gh api --paginate "repos/$repo/actions/workflows?per_page=100" --jq '.workflows[] | select(.state == "active") | [.id, .name, .path] | @tsv')
          if [ "$observed" -eq 0 ]; then aggregate_state="error"; aggregate_description="no main workflow runs observed"; elif [ "$failed" -eq 0 ]; then aggregate_state="success"; aggregate_description="$observed observed workflows green; $unobserved not scheduled"; else aggregate_state="failure"; aggregate_description="$failed of $observed observed workflows require repair"; fi
          gh api --method POST "repos/$repo/statuses/$sha" -f state="$aggregate_state" -f context="ci/aggregate" -f description="$aggregate_description" -f target_url="$actions_url" >/dev/null
