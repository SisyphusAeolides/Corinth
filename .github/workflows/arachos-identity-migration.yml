name: ArachOS identity migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/arachos-identity-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Rewrite tracked identity strings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          result = subprocess.run(
              ["git", "grep", "-Il", "-e", "Arach OS", "-e", "Arach-OS", "--", "."],
              check=False,
              capture_output=True,
              text=True,
          )
          for name in sorted(filter(None, result.stdout.splitlines())):
              path = Path(name)
              data = path.read_bytes()
              updated = data.replace(b"Arach-OS", b"ArachOS").replace(b"Arach OS", b"ArachOS")
              if updated != data:
                  path.write_bytes(updated)

          Path(".github/workflows/arachos-identity-migration.yml").unlink()
          PY
          if git grep -I -n -e 'Arach OS' -e 'Arach-OS' -- .; then
            echo 'stale ArachOS identity remains' >&2
            exit 1
          fi
          git diff --check
      - name: Commit identity migration
        run: |
          git config user.name 'SisyphusAeolides'
          git config user.email '37166405+SisyphusAeolides@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: adopt ArachOS identity'
          git push origin HEAD:main
