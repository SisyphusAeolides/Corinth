name: Repair Rust formatting

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci-repair-rustfmt.yml

permissions:
  contents: write

concurrency:
  group: ci-repair-rustfmt
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
      - name: Commit formatting
        run: |
          git config user.name 'SisyphusAeolides'
          git config user.email '37166405+SisyphusAeolides@users.noreply.github.com'
          git add -- '*.rs'
          git commit -m 'style: format Rust sources'
          git pull --rebase origin main
          git push origin HEAD:main
